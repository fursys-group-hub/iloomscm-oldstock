<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans KR', 'Montserrat', sans-serif; background: #FFFFFF; color: #333333; font-size: 14px; letter-spacing: -0.2px; }

/* 상단 네비 */
.nav {
  background: #FFFFFF;
  color: #333333;
  padding: 0 24px;
  display: flex;
  align-items: center;
  height: 60px;
  gap: 0;
  border-bottom: 1px solid #E0E0E0;
}
.nav-brand {
  font-family: 'Montserrat', sans-serif;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.5px;
  margin-right: 32px;
  white-space: nowrap;
  color: #c80a1e;
}
.nav-brand span { color: #333333; font-family: 'Noto Sans KR', sans-serif; font-size: 14px; font-weight: 500; margin-left: 8px; }
.nav-menu { display: flex; gap: 0; flex: 1; align-items: center; height: 100%; }
.nav-item {
  padding: 0 18px;
  height: 100%;
  display: flex;
  align-items: center;
  font-size: 14px;
  font-weight: 400;
  cursor: pointer;
  color: #333333;
  text-decoration: none;
  transition: all 0.2s;
  white-space: nowrap;
  letter-spacing: -0.2px;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
}
.nav-item:hover { color: #c80a1e; }
.nav-item.active { color: #c80a1e; border-bottom-color: #c80a1e; font-weight: 700; }
.nav-right { font-size: 12px; color: #999999; white-space: nowrap; display: flex; align-items: center; gap: 12px; }
.nav-right .ref-date { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; background: #F8F8F8; border: 1px solid #E0E0E0; color: #333333; font-weight: 500; }
.nav-right .ref-date::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #c80a1e; }
.nav-right .ref-date.loading::before { background: #999999; }
.nav-right .ref-date .label { color: #999999; font-weight: 400; }

/* 메인 컨텐츠 */
.main { padding: 32px 24px; max-width: 1700px; margin: 0 auto; }

/* 공통 카드 */
.card {
  background: #FFFFFF;
  border: 1px solid #E0E0E0;
  margin-bottom: 20px;
}
.card-header {
  padding: 16px 20px;
  border-bottom: 1px solid #E0E0E0;
  display: flex;
  align-items: center;
  gap: 10px;
}
.card-title { font-size: 16px; font-weight: 500; color: #333333; letter-spacing: -0.2px; }
.card-body { padding: 20px; }

/* 공통 버튼 */
.btn {
  padding: 8px 16px;
  border: 1px solid #E0E0E0;
  border-radius: 0;
  font-size: 13px;
  cursor: pointer;
  font-weight: 500;
  transition: all 0.2s;
  font-family: inherit;
  letter-spacing: -0.2px;
}
.btn-primary { background: #c80a1e; color: #FFFFFF; border-color: #c80a1e; }
.btn-primary:hover { opacity: 0.85; }
.btn-danger { background: #FFFFFF; color: #c80a1e; border: 1px solid #c80a1e; }
.btn-danger:hover { background: #c80a1e; color: #FFFFFF; }
.btn-ghost { background: #FFFFFF; color: #333333; border: 1px solid #E0E0E0; }
.btn-ghost:hover { background: #F8F8F8; }
.btn-sm { padding: 5px 12px; font-size: 12px; }

/* 공통 폼 */
.form-row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 12px; }
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-label { font-size: 12px; font-weight: 500; color: #999999; }
.form-input {
  padding: 8px 12px;
  border: 1px solid #E0E0E0;
  border-radius: 0;
  font-size: 13px;
  background: #FFFFFF;
  outline: none;
  font-family: inherit;
  color: #333333;
}
.form-input:focus { border-color: #c80a1e; background: #FFFFFF; }

/* 알림 */
.alert {
  padding: 12px 16px;
  border: 1px solid #E0E0E0;
  border-radius: 0;
  font-size: 13px;
  margin-bottom: 16px;
}
.alert-error { background: #FFFFFF; color: #c80a1e; border-left: 3px solid #c80a1e; }
.alert-info { background: #F8F8F8; color: #333333; border-left: 3px solid #333333; }

/* ─────────── 공통: 일룸 코드 / 세트 구성단품 모달 ─────────── */
.iloom-code {
  color: #c80a1e; cursor: pointer;
  font-family: 'Montserrat', monospace; font-weight: 600;
  text-decoration: none;
}
.iloom-code:hover { text-decoration: underline; }
.iloom-code-go {
  display: inline-block; margin-left: 6px;
  padding: 1px 6px; font-size: 10px; font-family: inherit;
  background: #fff; border: 1px solid #c80a1e; color: #c80a1e;
  cursor: pointer; border-radius: 0;
  vertical-align: middle; line-height: 1.4;
  text-decoration: none; transition: all 0.15s;
}
.iloom-code-go:hover { background: #c80a1e; color: #fff; text-decoration: none; }
.iloom-modal-overlay {
  position: fixed; inset: 0; z-index: 9998;
  background: rgba(0,0,0,0.4);
  display: none; align-items: center; justify-content: center;
}
.iloom-modal-overlay.show { display: flex; }
.iloom-modal-box {
  background: #fff; min-width: 760px; max-width: 90vw; max-height: 80vh;
  border: 1px solid #E0E0E0; display: flex; flex-direction: column;
  font-family: 'Noto Sans KR', sans-serif;
}
.iloom-modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px; border-bottom: 1px solid #E0E0E0;
}
.iloom-modal-title { font-size: 14px; font-weight: 600; color: #333; }
.iloom-modal-actions { display: flex; gap: 8px; align-items: center; }
.iloom-modal-go {
  font-size: 11px; padding: 3px 10px; border: 1px solid #c80a1e;
  color: #c80a1e; text-decoration: none; background: #fff;
}
.iloom-modal-go:hover { background: #c80a1e; color: #fff; }
.iloom-modal-close {
  border: none; background: none; font-size: 22px; line-height: 1;
  cursor: pointer; color: #999; padding: 0;
}
.iloom-modal-close:hover { color: #c80a1e; }
.iloom-modal-content { padding: 14px 18px; overflow: auto; }
.iloom-modal-content table { width: 100%; border-collapse: collapse; font-size: 12px; }
.iloom-modal-content th {
  background: #333; color: #fff; padding: 8px 10px;
  text-align: left; font-weight: 700; font-size: 11px;
}
.iloom-modal-content th.num,
.iloom-modal-content td.num { text-align: right; font-variant-numeric: tabular-nums; }
.iloom-modal-content td { padding: 7px 10px; border-bottom: 1px solid #F0F0F0; }
.iloom-modal-content tbody tr:hover td { background: #fdf5f5; }
.iloom-modal-empty { padding: 32px; text-align: center; color: #999; font-size: 12px; }

/* 일룸 홈페이지 iframe 팝업 (큰 사이즈) */
.iloom-modal-box.iloom-page-box {
  width: 92vw; max-width: 1280px; height: 88vh; max-height: 88vh;
  min-width: 760px;
}
.iloom-page-frame-wrap {
  flex: 1; padding: 0; overflow: hidden; background: #F8F8F8; position: relative;
}
.iloom-page-frame-wrap iframe {
  width: 100%; height: 100%; border: none; background: #fff;
}
.iloom-page-fallback {
  position: absolute; inset: 0; display: none;
  flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; color: #666; font-size: 13px; text-align: center; padding: 24px;
}
.iloom-page-fallback.show { display: flex; }

/* ══════ 컬럼 우클릭 검색 (글로벌) ══════ */
.iloom-col-filter-popover {
  position: absolute; z-index: 10000;
  background: #fff; border: 1px solid #d4d4d8;
  border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.15);
  padding: 10px 12px; min-width: 240px;
  font-family: inherit;
}
.iloom-col-filter-popover .icfp-title {
  font-size: 11px; font-weight: 700; color: #333; margin-bottom: 6px;
}
.iloom-col-filter-popover .icfp-input {
  width: 100%; box-sizing: border-box; padding: 6px 9px;
  border: 1px solid #d4d4d8; border-radius: 5px; font-size: 12px;
  outline: none; font-family: inherit;
}
.iloom-col-filter-popover .icfp-input:focus { border-color: #c80a1e; }
.iloom-col-filter-popover .icfp-hint {
  font-size: 10px; color: #999; margin-top: 4px;
}
.iloom-col-filter-popover .icfp-actions {
  display: flex; gap: 6px; justify-content: flex-end; margin-top: 8px;
}
.iloom-col-filter-popover .icfp-btn {
  padding: 4px 10px; font-size: 11px; cursor: pointer;
  border: 1px solid #ddd; border-radius: 4px; background: #fff;
  font-family: inherit;
}
.iloom-col-filter-popover .icfp-btn.icfp-apply {
  background: #c80a1e; color: #fff; border-color: #c80a1e;
}
.iloom-col-filter-popover .icfp-btn.icfp-clear:hover { background: #f3f4f6; }

/* 필터 활성 컬럼 표시 */
th.iloom-col-filter-active {
  box-shadow: inset 0 -3px 0 #c80a1e !important;
  position: relative;
}
th.iloom-col-filter-active::after {
  content: '🔍'; font-size: 9px; margin-left: 4px; opacity: 0.7;
}

/* 우클릭 가능 안내 (전역 미세 표시) */
.iloom-col-filter-hint {
  display: inline-block; font-size: 10px; color: #999;
  margin: 4px 0; padding: 2px 6px; background: #f3f4f6; border-radius: 3px;
}
</style>

<style>

.sp-filter {

  display:flex; gap:10px; flex-wrap:wrap; align-items:center;

.loading-banner {

<div id="sp-app">

                style="padding:6px 14px; font-size:12px; background:#fff; color:#666; border:none; border-left:1px solid #E0E0E0; cursor:pointer; font-family:inherit;">금액(백만원)</button>

      <option value="">전체 신호</option>

      </thead>

<script>
let DATA = null;        // { rows, kpi, meta, this_ym, passed_wd, total_wd, loaded_at }
let groupFilter = "";   // 4분류 필터 (KPI/종합 클릭 시)
let supplierFilter = "";// 공급처 필터 (종합 레벨3 클릭 시)
let sortKey = "진행률_편차율";
let sortDir = "desc";
let drillLevel = 1;     // 1=전체, 2=4분류, 3=공급처
let drillGroup = null;  // 레벨 3일 때 선택된 분류명
let MODE = 'qty';       // 'qty' | 'amt' — 수량/금액(백만원) 표시 토글

function fmtNum(v, dec) {
  if (v == null || v === '') return '-';
  const n = Number(v);
  if (!isFinite(n)) return '-';
  return n.toLocaleString('ko-KR', { minimumFractionDigits: dec || 0, maximumFractionDigits: dec || 0 });
}

// 단품 row의 (수량/금액) 표시값 — 금액 모드는 수량 × 공장도가 / 1e6 (백만원)
function valOf(r, qtyField) {
  const q = Number(r[qtyField] || 0);
  if (MODE === 'qty') return q;
  const p = Number(r.공장도가 || 0);
  return q * p / 1000000;
}
function fmtVal(r, qtyField, decQty) {
  if (MODE === 'qty') return fmtNum(r[qtyField], decQty || 0);
  return fmtNum(valOf(r, qtyField), 1);
}
// 집계 합계 표시값 포맷 — qty 모드는 정수, amt 모드는 소수1자리(백만원 단위로 이미 변환됨)
function fmtSum(v, decQty) {
  if (MODE === 'qty') return fmtNum(v, decQty || 0);
  return fmtNum(v, 1);
}

function setMode(m) {
  MODE = m;
  document.querySelectorAll('.sp-mode-btn').forEach(b => {
    const active = b.dataset.mode === m;
    b.classList.toggle('active', active);
    b.style.background = active ? '#c80a1e' : '#fff';
    b.style.color = active ? '#fff' : '#666';
  });
  syncAll();
}

function sigClass(s) {
  if (s === '정상') return 'ok';
  if (s === '주의') return 'warn';
  if (s === '경고') return 'bad';
  return 'muted';
}

// ─── 종합 집계 ─── (MODE에 따라 수량 합 또는 금액(백만원) 합)
function aggregate(rows) {
  let req = 0, plan = 0, act = 0, cnt = 0;
  for (const r of rows) {
    req += valOf(r, '공급요청량');
    plan += valOf(r, '기준량');
    act += valOf(r, '공급실적');
    cnt++;
  }
  return { req, plan, act, cnt };
}

function devPctSignal(plan, act) {
  if (!plan || plan <= 0) return { dev: null, sig: '-' };
  const dev = (act - plan) / plan * 100;
  const abs = Math.abs(dev);
  let sig = '경고';
  if (abs <= 10) sig = '정상';
  else if (abs <= 20) sig = '주의';
  return { dev: Number(dev.toFixed(1)), sig };
}

function aggByGroup(rows) {
  const map = {};
  for (const r of rows) {
    const g = r.품목구분 || '기타';
    if (!map[g]) map[g] = [];
    map[g].push(r);
  }
  const order = ['관계사', '수입', '협력사', 'VN', '기타'];
  return order.filter(g => map[g]).map(g => ({ key: g, ...aggregate(map[g]) }));
}

function aggBySupplier(rows) {
  // VN 분류는 공급처그룹(VN목제/VN소파/VN의자)으로 묶어서 표시
  // 그 외 분류는 공급처 원본 그대로 그룹핑
  const map = {};
  for (const r of rows) {
    const grp = r.공급처그룹 || '';
    const key = grp.startsWith('VN') ? grp : (r.공급처 || '(미상)');
    if (!map[key]) map[key] = [];
    map[key].push(r);
  }
  return Object.entries(map)
    .map(([s, rs]) => ({ key: s, ...aggregate(rs) }))
    .filter(d => d.req > 0)  // 공급요청 없는 공급처 숨김
    .sort((a, b) => b.req - a.req);
}

function sigCls(sig) {
  if (sig === '정상') return 'ok';
  if (sig === '주의') return 'warn';
  if (sig === '경고') return 'bad';
  return 'muted';
}

function buildBar(value, max, kind, sigKind) {
  const pct = max > 0 ? Math.min(100, (value / max) * 100) : 0;
  const cls = kind === 'act' && sigKind ? `${kind} ${sigKind}` : kind;
  return `<div class="sp-bar-track"><div class="sp-bar-fill ${cls}" style="width:${pct.toFixed(1)}%"></div></div>`;
}

function renderRow(d, clickable, scaleMax, kind) {
  const max = scaleMax || d.req || 1;
  const ds = devPctSignal(d.plan, d.act);
  const planOfReq = d.req > 0 ? (d.plan / d.req * 100).toFixed(0) : 0;
  const actOfReq  = d.req > 0 ? (d.act  / d.req * 100).toFixed(0) : 0;
  const sigCss = sigCls(ds.sig);

  const onclick = clickable ? `onclick="drillTo('${d.key.replace(/'/g, "\\'")}')"` : '';
  // 마지막 단계(공급처)는 필터 적용 표시만, ▸는 더 이상 아래 단계 없으므로 ⨯ 또는 ▾로 변경
  const active = (kind === 'supplier' && supplierFilter === d.key);
  const chev = clickable ? `<span class="chev">${kind === 'supplier' ? (active ? '✓' : '▾') : '▸'}</span>` : '';

  return `
    <div class="sp-summary-row ${clickable ? 'clickable' : ''} ${active ? 'active' : ''}" ${onclick}>
      <div class="sp-row-label">
        ${chev}
        <span>${escapeHtml(d.key)}</span>
        <span class="sub">(${d.cnt.toLocaleString()}건)</span>
      </div>
      <div class="sp-bars">
        <div class="sp-bar-line">
          <span class="lbl">요청</span>
          ${buildBar(d.req, max, 'req')}
          <span class="val">${fmtSum(d.req)} <span class="pct">목표</span></span>
        </div>
        <div class="sp-bar-line">
          <span class="lbl">계획</span>
          ${buildBar(d.plan, max, 'plan')}
          <span class="val">${fmtSum(d.plan)} <span class="pct">${planOfReq}% 도달</span></span>
        </div>
        <div class="sp-bar-line">
          <span class="lbl">실적</span>
          ${buildBar(d.act, max, 'act', sigCss)}
          <span class="val">${fmtSum(d.act)} <span class="pct">${actOfReq}% 도달</span></span>
        </div>
      </div>
      <div class="sp-row-dev ${sigCss}">
        ${ds.dev == null ? '-' : (ds.dev > 0 ? '+' : '') + ds.dev + '%'}
        <span class="sub">계획 대비</span>
      </div>
      <div class="sp-row-sig"><span class="pill ${sigCss}">${ds.sig}</span></div>
    </div>`;
}

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function renderSummary() {
  if (!DATA) return;
  const body = document.getElementById('spSummaryBody');
  const bc = document.getElementById('spBreadcrumb');

  // breadcrumb
  let bcHtml = '';
  if (drillLevel === 1) {
    bcHtml = `<span class="crumb current">전체</span>`;
  } else if (drillLevel === 2) {
    bcHtml = `<span class="crumb" onclick="drillUp(1)">전체</span><span class="sep">▸</span><span class="crumb current">4분류</span>`;
  } else {
    bcHtml = `<span class="crumb" onclick="drillUp(1)">전체</span><span class="sep">▸</span><span class="crumb" onclick="drillUp(2)">4분류</span><span class="sep">▸</span><span class="crumb current">${escapeHtml(drillGroup)} 공급처별</span>`;
  }
  bc.innerHTML = bcHtml;

  const rows = DATA.rows || [];
  if (drillLevel === 1) {
    const total = aggregate(rows);
    body.innerHTML = renderRow({ key: '전체', ...total }, true, total.req);
  } else if (drillLevel === 2) {
    const groups = aggByGroup(rows);
    const maxReq = Math.max(...groups.map(g => g.req), 1);
    body.innerHTML = groups.map(g => renderRow(g, true, maxReq)).join('');
  } else {
    const filtered = rows.filter(r => (r.품목구분 || '기타') === drillGroup);
    const suppliers = aggBySupplier(filtered);
    if (suppliers.length === 0) {
      body.innerHTML = `<div class="sp-summary-empty">${escapeHtml(drillGroup)} 분류에 공급요청 데이터가 없습니다.</div>`;
      return;
    }
    const maxReq = Math.max(...suppliers.map(s => s.req), 1);
    // 공급처 행은 클릭 시 메인 리스트 필터로 동기화 (3레벨이 마지막)
    body.innerHTML = suppliers.map(s => renderRow(s, true, maxReq, 'supplier')).join('');
  }
}

function drillTo(key) {
  if (drillLevel === 1) {
    // 전체 행 클릭 → 4분류 보기 (필터는 해제)
    drillLevel = 2;
    groupFilter = "";
    supplierFilter = "";
  } else if (drillLevel === 2) {
    // 분류 행 클릭 → 공급처 보기 + 메인 리스트 분류 필터
    drillLevel = 3;
    drillGroup = key;
    groupFilter = key;
    supplierFilter = "";
  } else if (drillLevel === 3) {
    // 공급처 행 클릭 → 메인 리스트 공급처 필터 (그 자리 유지)
    supplierFilter = key;
  }
  syncAll();
}

function drillUp(level) {
  drillLevel = level;
  if (level < 3) {
    drillGroup = null;
    supplierFilter = "";
  }
  if (level === 1) {
    groupFilter = "";
  }
  syncAll();
}

// 표 헤더 — MODE에 따라 라벨 suffix 변경
function buildHeader() {
  const sfx = MODE === 'amt' ? '<br><span style="font-size:9px;color:#bbb;">백만원</span>' : '';
  const cols = [
    ['품목구분', '구분', ''],
    ['공급처', '공급처', ''],
    ['단품코드', '단품코드', ''],
    ['색상', '색상', ''],
    ['단품명', '단품명', 'tl'],
    ['사용구분', '사용구분', ''],
    ['_12개월평균', '12개월평균', '', true],
    ['안전재고', '안전재고', '', true],
    ['적정재고', '적정재고', '', true],
    ['공급요청량', '공급요청' + (MODE === 'amt' ? '금액' : '량') + '<br>(이번달)', '', true],
    ['기준량', '계획 일할치<br>(경과 WD)', '', true],
    ['공급실적', '공급실적' + (MODE === 'amt' ? '금액' : '') + '<br>(이번달+예정)', '', true],
    ['진행률_편차율', '진행률<br>편차%', ''],
    ['진행률_신호', '진행<br>신호', ''],
  ];
  const ths = cols.map(([k, label, cls, withSfx]) => {
    const c = cls ? ` class="${cls}"` : '';
    const labelHtml = withSfx ? (label.includes('<br>') ? label.replace('<br>', sfx + '<br>') : label + sfx) : label;
    return `<th${c} onclick="sortBy('${k}')">${labelHtml}</th>`;
  }).join('');
  document.getElementById('spThead').innerHTML = `<tr>${ths}</tr>`;
}

// KPI/종합/메인 리스트를 모두 현재 필터 상태로 다시 그림
function syncAll() {
  buildHeader();
  buildKpi();
  renderSummary();
  render();
}

function buildKpi() {
  const kpi = DATA.kpi || {};
  const order = ["전체", "관계사", "수입", "협력사", "VN"];
  const allRows = DATA.rows || [];
  const row = document.getElementById('spKpiRow');
  row.innerHTML = order.map(g => {
    const d = kpi[g] || { 정상: 0, 주의: 0, 경고: 0, _total: 0 };
    const isActive = (groupFilter === g) || (!groupFilter && g === '전체');
    // 진행률 막대용 집계
    const subRows = (g === '전체') ? allRows : allRows.filter(r => r.품목구분 === g);
    const ag = aggregate(subRows);
    const ds = devPctSignal(ag.plan, ag.act);
    const sigCss = sigCls(ds.sig);
    const planPct = ag.req > 0 ? Math.min(100, (ag.plan / ag.req) * 100) : 0;
    const actPct  = ag.req > 0 ? Math.min(100, (ag.act  / ag.req) * 100) : 0;
    const actOfReq = ag.req > 0 ? (ag.act / ag.req * 100).toFixed(0) : 0;
    return `
      <div class="sp-kpi ${isActive ? 'active' : ''}" onclick="setGroup('${g}')">
        <div class="grp">${g}</div>
        <div class="signals">
          <span class="sig ok"><span class="dot"></span><b>${d.정상}</b> 정상</span>
          <span class="sig warn"><span class="dot"></span><b>${d.주의}</b> 주의</span>
          <span class="sig bad"><span class="dot"></span><b>${d.경고}</b> 경고</span>
        </div>
        <div class="total">총 ${d._total.toLocaleString()}건</div>
        <div class="sp-kpi-bar" title="요청 ${fmtSum(ag.req)} / 계획 ${fmtSum(ag.plan)} / 실적 ${fmtSum(ag.act)}${MODE==='amt' ? ' (백만원)' : ''}">
          <div class="row">
            <div class="track">
              <div class="fill-plan" style="width:${planPct.toFixed(1)}%"></div>
              <div class="fill-act ${sigCss}" style="width:${actPct.toFixed(1)}%"></div>
            </div>
            <span class="val">${actOfReq}%<span class="pct">도달</span></span>
          </div>
        </div>
      </div>`;
  }).join('');
}

function setGroup(g) {
  groupFilter = (g === '전체') ? '' : g;
  supplierFilter = "";  // 분류 변경 시 공급처 필터 해제
  // 종합 드릴다운도 KPI 클릭과 동기화: 전체→레벨1, 그 외→레벨3 (공급처 보기)
  if (g === '전체') {
    drillLevel = 1;
    drillGroup = null;
  } else {
    drillLevel = 3;
    drillGroup = g;
  }
  syncAll();
}

function sortBy(k) {
  if (sortKey === k) {
    sortDir = (sortDir === 'asc') ? 'desc' : 'asc';
  } else {
    sortKey = k;
    sortDir = 'desc';
  }
  // 헤더 표시 갱신
  document.querySelectorAll('#spTable thead th').forEach(th => th.classList.remove('sa', 'sd'));
  const ths = document.querySelectorAll('#spTable thead th');
  // 매핑 — 위 표 순서대로 attr 사용해도 되지만 간단히 onclick 텍스트 기반
  render();
}

function filteredRows() {
  let rows = DATA.rows || [];
  if (groupFilter) rows = rows.filter(r => r.품목구분 === groupFilter);
  if (supplierFilter) {
    // VN 그룹명(VN목제/VN소파/VN의자) 필터는 공급처그룹 기준, 그 외는 공급처 원본 기준
    if (supplierFilter.startsWith('VN')) {
      rows = rows.filter(r => (r.공급처그룹 || '') === supplierFilter);
    } else {
      rows = rows.filter(r => (r.공급처 || '(미상)') === supplierFilter);
    }
  }
  const sigF = document.getElementById('spSigFilter').value;
  if (sigF) rows = rows.filter(r => r.진행률_신호 === sigF);
  const useF = document.getElementById('spUseFilter').value;
  if (useF) rows = rows.filter(r => r.사용구분 === useF);
  const q = (document.getElementById('spSearch').value || '').toLowerCase();
  if (q) {
    rows = rows.filter(r =>
      (r.단품코드 || '').toLowerCase().includes(q) ||
      (r.단품명 || '').toLowerCase().includes(q) ||
      (r.공급처 || '').toLowerCase().includes(q)
    );
  }
  rows = rows.slice();
  const dir = sortDir === 'asc' ? 1 : -1;
  // 금액 모드에서 수량 컬럼 정렬은 (수량 × 공장도가) 기준
  const AMT_SORTABLE = new Set(['_12개월평균', '안전재고', '적정재고', '공급요청량', '기준량', '공급실적']);
  const useAmt = (MODE === 'amt' && AMT_SORTABLE.has(sortKey));
  rows.sort((a, b) => {
    const va = useAmt ? valOf(a, sortKey) : a[sortKey];
    const vb = useAmt ? valOf(b, sortKey) : b[sortKey];
    if (va == null && vb == null) return 0;
    if (va == null) return 1;
    if (vb == null) return -1;
    if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * dir;
    return String(va).localeCompare(String(vb), 'ko') * dir;
  });
  return rows;
}

function render() {
  if (!DATA) return;
  const rows = filteredRows();
  const tbody = document.getElementById('spTbody');
  const tags = [];
  if (groupFilter)    tags.push(`<span style="display:inline-block;padding:2px 8px;background:#fff5f5;color:#c80a1e;border:1px solid #c80a1e;font-size:11px;margin-right:4px;">${groupFilter} <a href="#" onclick="event.preventDefault();setGroup('전체');" style="color:#c80a1e;text-decoration:none;margin-left:4px;">✕</a></span>`);
  if (supplierFilter) tags.push(`<span style="display:inline-block;padding:2px 8px;background:#fff5f5;color:#c80a1e;border:1px solid #c80a1e;font-size:11px;margin-right:4px;">${supplierFilter} <a href="#" onclick="event.preventDefault();supplierFilter='';syncAll();" style="color:#c80a1e;text-decoration:none;margin-left:4px;">✕</a></span>`);
  const tagStr = tags.length ? ` · 필터: ${tags.join(' ')}` : '';
  document.getElementById('spCount').innerHTML = `표시: <b>${rows.length.toLocaleString()}</b> / 전체 ${(DATA.rows || []).length.toLocaleString()}${tagStr}`;

  if (rows.length === 0) {
    tbody.innerHTML = `<tr><td colspan="14" class="tc" style="padding:40px;color:#999;">데이터 없음</td></tr>`;
    return;
  }

  tbody.innerHTML = rows.map(r => `
    <tr>
      <td class="tc"><span class="cat-pill ${r.품목구분}">${r.품목구분}</span></td>
      <td class="tl">${r.공급처 || '-'}</td>
      <td class="tc">${r.단품코드}</td>
      <td class="tc">${r.색상 || ''}</td>
      <td class="tl" title="${r.단품명 || ''}">${r.단품명 || ''}</td>
      <td class="tc">${r.사용구분 || ''}</td>
      <td>${fmtVal(r, '_12개월평균', 1)}</td>
      <td>${fmtVal(r, '안전재고')}</td>
      <td>${fmtVal(r, '적정재고')}</td>
      <td>${fmtVal(r, '공급요청량')}</td>
      <td>${fmtVal(r, '기준량', 1)}</td>
      <td>${fmtVal(r, '공급실적')}</td>
      <td>${r.진행률_편차율 == null ? '-' : fmtNum(r.진행률_편차율, 1) + '%'}</td>
      <td class="tc"><span class="pill ${sigClass(r.진행률_신호)}">${r.진행률_신호}</span></td>
    </tr>
  `).join('');
}

function buildMeta() {
  const m = DATA.meta || {};
  const el = document.getElementById('spMeta');
  el.innerHTML = `
    <span><span class="lbl">예측 생성일:</span> <b>${m.예측생성일자 || '-'}</b></span>
    <span><span class="lbl">예측 기간:</span> <b>${m.예측기간 || '-'}</b></span>
    <span><span class="lbl">기준월:</span> <b>${DATA.this_ym || '-'}</b></span>
    <span><span class="lbl">워킹데이:</span> <b>${DATA.passed_wd}/${DATA.total_wd}</b></span>
    <span><span class="lbl">데이터 갱신:</span> <b>${DATA.loaded_at || '-'}</b></span>
  `;
}

async function loadData() {
  // 정적(외부망 GitHub Pages) 배포: 인라인 데이터가 주입돼 있으면 fetch 대신 사용
  if (window.__SUPPLY_STATIC__) {
    DATA = window.__SUPPLY_STATIC__;
    document.getElementById('spBanner').innerHTML = '';
    buildMeta();
    buildHeader();
    buildKpi();
    renderSummary();
    render();
    return;
  }
  try {
    const res = await fetch('/supply/api/data');
    if (res.status === 503) {
      const s = await res.json();
      document.getElementById('spBanner').innerHTML = `<div class="loading-banner">⏳ 데이터 준비 중 (${s.status}) — 잠시 후 새로고침해주세요.</div>`;
      setTimeout(loadData, 3000);
      return;
    }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    DATA = await res.json();
    document.getElementById('spBanner').innerHTML = '';
    buildMeta();
    buildHeader();
    buildKpi();
    renderSummary();
    render();
  } catch (e) {
    document.getElementById('spBanner').innerHTML = `<div class="error-banner">조회 실패: ${e.message}</div>`;
  }
}

function downloadExcel() {
  if (!DATA) return;
  const rows = filteredRows();
  const sfx = MODE === 'amt' ? '(백만원)' : '';
  const header = [
    "구분", "공급처", "단품코드", "색상", "단품명", "사용구분",
    `12개월평균${sfx}`, `안전재고${sfx}`, `적정재고${sfx}`,
    `공급${MODE==='amt'?'요청금액':'요청량'}(이번달)${sfx}`,
    `계획 일할치${sfx}`,
    `공급실적${MODE==='amt'?'금액':''}(이번달+예정)${sfx}`,
    "진행률 편차%", "진행 신호",
  ];
  const v = (r, k, dec) => {
    const raw = valOf(r, k);
    if (MODE === 'amt') return Number(raw.toFixed(1));  // 백만원 소수1자리
    return Number(raw.toFixed(dec || 0));
  };
  const data = [header].concat(rows.map(r => [
    r.품목구분, r.공급처, r.단품코드, r.색상, r.단품명, r.사용구분,
    v(r, '_12개월평균', 1), v(r, '안전재고'), v(r, '적정재고'),
    v(r, '공급요청량'), v(r, '기준량', 1), v(r, '공급실적'),
    r.진행률_편차율, r.진행률_신호,
  ]));
  const ws = XLSX.utils.aoa_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "공급량관리");
  const today = new Date();
  const ymd = today.getFullYear().toString() +
              String(today.getMonth() + 1).padStart(2, '0') +
              String(today.getDate()).padStart(2, '0');
  const modeLabel = MODE === 'amt' ? '_금액' : '';
  XLSX.writeFile(wb, `일룸_공급량관리${modeLabel}_${ymd}.xlsx`);
}

loadData();
</script>

<div class="iloom-modal-overlay" id="iloomPageModal" onclick="if(event.target===this) IloomCode.closePageModal()">

      <div class="iloom-modal-actions">

        <button type="button" class="iloom-modal-close" onclick="IloomCode.closePageModal()">×</button>
      </div>

    <div class="iloom-page-frame-wrap">

        <div style="font-size:11px;color:#999">상대 사이트의 보안 정책(X-Frame-Options) 때문일 수 있어요.</div>
        <a id="iloomPageModalFallbackLink" href="#" target="_blank" rel="noopener" class="btn btn-primary" style="margin-top:6px;">새 탭으로 열기 ↗</a>
      </div>
    </div>
  </div>

<script>
/* ────────── 공통: 일룸 코드 핸들러 (어떤 대시보드에서든 사용) ──────────
 * 마크업:
 *   <a class="iloom-code" data-iloom-code="IUX25028" data-iloom-type="set">IUX25028</a>
 *   - data-iloom-type: 'set' | 'item' | 'auto' (기본 auto: 구성단품 있으면 모달, 없으면 새 탭)
 *   <a class="iloom-code-go" data-iloom-go="IUX25028">iloom ↗</a>  (← 항상 새 탭으로 일룸 홈페이지)
 * 헬퍼 (JS 렌더링용):
 *   IloomCode.cell(code, type)  → '<a class=...>코드</a><a class="iloom-code-go" ...>iloom ↗</a>'
 *   IloomCode.handle(code, type) / openItem(code) / openSetComponents(code)
 */
window.IloomCode = (function() {
  const PRODUCT_URL = 'https://www.iloom.com/product/detail.do?productCd=';
  const SET_COMPONENTS_ENDPOINT = '/new-product/set-components/';
  const SETS_BY_ITEM_ENDPOINT   = '/new-product/sets-by-item/';

  function baseCode(code) { return (code || '').toString().split('-')[0]; }
  function fmtNum(v) {
    if (v == null || v === '') return '-';
    const n = Number(v);
    if (!isFinite(n)) return '-';
    return n.toLocaleString('ko-KR', { maximumFractionDigits: 1 });
  }
  function escHtml(s) {
    return (s == null ? '' : String(s))
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function openItem(code) {
    if (!code) return;
    const url = PRODUCT_URL + encodeURIComponent(baseCode(code));
    const modal    = document.getElementById('iloomPageModal');
    const frame    = document.getElementById('iloomPageModalFrame');
    const title    = document.getElementById('iloomPageModalTitle');
    const newTab   = document.getElementById('iloomPageModalNewTab');
    const fallback = document.getElementById('iloomPageModalFallback');
    const fbLink   = document.getElementById('iloomPageModalFallbackLink');
    if (!modal || !frame) {
      // 모달이 없으면 새 탭으로 폴백
      window.open(url, '_blank', 'noopener');
      return;
    }
    title.textContent = baseCode(code) + ' · iloom 홈페이지';
    newTab.href = url;
    if (fbLink) fbLink.href = url;
    fallback.classList.remove('show');
    frame.src = url;
    modal.classList.add('show');

    // X-Frame-Options 등으로 iframe 로드가 막히면 일정 시간 후 폴백 안내 노출
    clearTimeout(window._iloomPageFallbackTimer);
    window._iloomPageFallbackTimer = setTimeout(() => {
      try {
        // 동일 오리진이면 contentDocument 접근 가능, 아니면 throw
        const doc = frame.contentDocument || frame.contentWindow.document;
        if (!doc || !doc.body || doc.body.children.length === 0) {
          fallback.classList.add('show');
        }
      } catch (e) {
        // cross-origin 접근 차단 = iframe이 정상 로드되었거나 차단된 경우 둘 다 가능.
        // 차단 여부를 정확히 알 수 없어 폴백 링크는 헤더에 항상 노출됨.
      }
    }, 2500);
  }

  function openItemNewTab(code) {
    if (!code) return;
    window.open(PRODUCT_URL + encodeURIComponent(baseCode(code)), '_blank', 'noopener');
  }

  function closePageModal() {
    const modal = document.getElementById('iloomPageModal');
    const frame = document.getElementById('iloomPageModalFrame');
    if (frame) frame.src = 'about:blank';
    if (modal) modal.classList.remove('show');
    clearTimeout(window._iloomPageFallbackTimer);
  }

  async function openSetComponents(code) {
    if (!code) return;
    const modal     = document.getElementById('iloomSetModal');
    const titleEl   = document.getElementById('iloomSetModalTitle');
    const goEl      = document.getElementById('iloomSetModalGoLink');
    const contentEl = document.getElementById('iloomSetModalContent');
    if (!modal) return;
    titleEl.textContent = code + ' · 구성단품';
    goEl.href = PRODUCT_URL + encodeURIComponent(baseCode(code));
    goEl.dataset.code = code;  // 헤더 링크 클릭 시 iframe 팝업으로 사용
    contentEl.innerHTML = '<div class="iloom-modal-empty">로딩 중...</div>';
    modal.classList.add('show');
    try {
      const res = await fetch(SET_COMPONENTS_ENDPOINT + encodeURIComponent(code));
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const comps = data.components || [];
      if (comps.length === 0) {
        contentEl.innerHTML = '<div class="iloom-modal-empty">구성단품이 없습니다 (단품일 가능성)</div>';
        return;
      }
      const note = data.shipment_status && data.shipment_status !== 'ready'
        ? `<div style="font-size:11px;color:#999;margin-bottom:8px">⚠ shipment 캐시 ${escHtml(data.shipment_status)} — 단품 월평균출고량 미표시</div>`
        : '';
      const rows = comps.map(c => `
        <tr>
          <td><a class="iloom-code" data-iloom-code="${escHtml(c.단품코드 + (c.단품색상 ? '-' + c.단품색상 : ''))}" data-iloom-type="item">${escHtml(c.단품코드)}</a></td>
          <td>${escHtml(c.단품색상 || '')}</td>
          <td>${escHtml(c.단품명칭 || '')}</td>
          <td class="num">${fmtNum(c.구성수량)}</td>
          <td>${escHtml(c.사용구분 || '')}</td>
          <td class="num">${fmtNum(c.가용재고)}</td>
          <td class="num">${fmtNum(c.월평균출고량)}</td>
        </tr>`).join('');
      contentEl.innerHTML = note + `
        <table>
          <thead>
            <tr>
              <th>단품코드</th><th>색상</th><th>단품명칭</th>
              <th class="num">구성수량</th><th>사용구분</th>
              <th class="num">가용재고</th><th class="num">단품 월평균출고량</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>`;
    } catch (e) {
      contentEl.innerHTML =
        '<div class="iloom-modal-empty" style="color:#c80a1e">조회 실패: ' +
        escHtml(e.message || String(e)) + '</div>';
    }
  }

  function closeModal() {
    const m = document.getElementById('iloomSetModal');
    if (m) m.classList.remove('show');
  }

  async function openItemSets(combo) {
    if (!combo) return;
    const modal     = document.getElementById('iloomItemSetsModal');
    const titleEl   = document.getElementById('iloomItemSetsModalTitle');
    const goEl      = document.getElementById('iloomItemSetsModalGoLink');
    const contentEl = document.getElementById('iloomItemSetsModalContent');
    if (!modal) return openItem(combo);  // 폴백: 모달 없으면 홈페이지 팝업
    titleEl.textContent = combo + ' · 포함 세트';
    goEl.dataset.code = combo;
    contentEl.innerHTML = '<div class="iloom-modal-empty">로딩 중...</div>';
    modal.classList.add('show');
    try {
      const res = await fetch(SETS_BY_ITEM_ENDPOINT + encodeURIComponent(combo));
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const sets = data.sets || [];
      if (sets.length === 0) {
        contentEl.innerHTML = '<div class="iloom-modal-empty">해당 단품을 포함한 세트가 없습니다</div>';
        return;
      }
      const note = data.shipment_status && data.shipment_status !== 'ready'
        ? `<div style="font-size:11px;color:#999;margin-bottom:8px">⚠ shipment 캐시 ${escHtml(data.shipment_status)} — 월 평출량 미표시</div>`
        : '';
      const rows = sets.map(s => {
        const setCombo = s.세트색상 ? `${s.세트코드}-${s.세트색상}` : s.세트코드;
        return `
          <tr>
            <td>
              <a class="iloom-code" data-iloom-code="${escHtml(setCombo)}" data-iloom-type="set" title="구성단품 보기">${escHtml(s.세트코드)}</a>
              <a class="iloom-code-go" data-iloom-go="${escHtml(setCombo)}" title="일룸 홈페이지 팝업">iloom ↗</a>
            </td>
            <td>${escHtml(s.세트색상 || '')}</td>
            <td>${escHtml(s.세트명칭 || '')}</td>
            <td class="num">${fmtNum(s.월평출량_최근1년)}</td>
          </tr>`;
      }).join('');
      contentEl.innerHTML = note + `
        <table>
          <thead>
            <tr>
              <th>세트코드</th><th>색상</th><th>세트명칭</th>
              <th class="num">월 평출량 (최근1년)</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>`;
    } catch (e) {
      contentEl.innerHTML =
        '<div class="iloom-modal-empty" style="color:#c80a1e">조회 실패: ' +
        escHtml(e.message || String(e)) + '</div>';
    }
  }

  function closeItemSetsModal() {
    const m = document.getElementById('iloomItemSetsModal');
    if (m) m.classList.remove('show');
  }

  // type: 'set' | 'item' | 'auto'
  //   set  → 구성단품 모달
  //   item → 포함 세트 모달 (해당 단품을 포함한 세트 목록)
  //   auto → 구성단품 조회 시도 → 있으면 set 모달, 없으면 item 모달, 둘 다 없으면 홈페이지
  async function handle(code, type) {
    if (!code) return;
    if (type === 'item') return openItemSets(code);
    if (type === 'set')  return openSetComponents(code);
    try {
      const res = await fetch(SET_COMPONENTS_ENDPOINT + encodeURIComponent(code));
      const data = res.ok ? await res.json() : { components: [] };
      if ((data.components || []).length > 0) return openSetComponents(code);
    } catch (e) { /* fall through */ }
    return openItemSets(code);
  }

  // JS 렌더링용 셀 HTML (코드 + iloom ↗ 버튼)
  function cell(code, type) {
    if (code == null || code === '') return '';
    const safeCode = escHtml(code);
    const safeType = (type === 'set' || type === 'item') ? type : 'auto';
    return `<a class="iloom-code" data-iloom-code="${safeCode}" data-iloom-type="${safeType}" title="클릭: ${
              safeType === 'set' ? '구성단품 보기' : safeType === 'item' ? '포함 세트 보기' : '자동 판별'
            }">${safeCode}</a>` +
           `<a class="iloom-code-go" data-iloom-go="${safeCode}" title="일룸 홈페이지 팝업">iloom ↗</a>`;
  }

  // 클릭 위임 (모든 페이지에서 자동 동작)
  document.addEventListener('click', function(e) {
    const goEl = e.target.closest('[data-iloom-go]');
    if (goEl) {
      e.preventDefault();
      openItem(goEl.getAttribute('data-iloom-go'));
      return;
    }
    const codeEl = e.target.closest('[data-iloom-code]');
    if (codeEl) {
      e.preventDefault();
      handle(codeEl.getAttribute('data-iloom-code'),
             codeEl.getAttribute('data-iloom-type') || 'auto');
    }
  });

  // ESC로 공통 모달 닫기
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      closeModal();
      closeItemSetsModal();
      closePageModal();
    }
  });

  return {
    openItem, openItemNewTab, openSetComponents, openItemSets,
    closeModal, closeItemSetsModal, closePageModal,
    handle, cell, baseCode, fmtNum
  };
})();
</script>

<script>
/* ══════════════════════════════════════════════════════════════════
 * IloomColFilter — 모든 페이지의 모든 테이블에 적용되는 글로벌 모듈
 *   • 테이블 헤더(thead th)를 우클릭하면 컬럼별 검색 popover 표시
 *   • 다중 컬럼 필터 AND 조합 (각 컬럼 contains, case-insensitive)
 *   • DataTables 사용 테이블은 본인의 contextmenu 핸들러가 우선 처리하므로
 *     이 모듈은 .dataTables_wrapper 안의 헤더는 무시 (충돌 방지)
 *   • 보호된 셀(.no-filter, target-cell 등)은 그대로 동작
 * ══════════════════════════════════════════════════════════════════ */
(function() {
  // table 요소별 필터 상태: tableEl → { colIdx: query, ... }
  const _filters = new WeakMap();
  let _active = null;  // { tableEl, colIdx }

  function _ensurePopover() {
    let pop = document.getElementById('iloomColFilterPopover');
    if (pop) return pop;
    pop = document.createElement('div');
    pop.id = 'iloomColFilterPopover';
    pop.className = 'iloom-col-filter-popover';
    pop.style.display = 'none';
    pop.innerHTML = `
      <div class="icfp-title" id="icfp-title"></div>
      <input type="text" class="icfp-input" id="icfp-input" placeholder="검색어 입력" />
      <div class="icfp-hint">Enter: 적용 · Esc: 닫기 · 빈 값으로 적용 시 해제</div>
      <div class="icfp-actions">
        <button type="button" class="icfp-btn icfp-clear">지우기</button>
        <button type="button" class="icfp-btn icfp-apply">적용</button>
      </div>`;
    document.body.appendChild(pop);

    pop.querySelector('.icfp-apply').addEventListener('click', _apply);
    pop.querySelector('.icfp-clear').addEventListener('click', _clear);

    document.addEventListener('mousedown', e => {
      if (pop.style.display !== 'none' && !pop.contains(e.target)) _hide();
    });
    document.addEventListener('keydown', e => {
      if (pop.style.display === 'none') return;
      if (e.key === 'Escape') _hide();
      else if (e.key === 'Enter' && document.activeElement.id === 'icfp-input') _apply();
    });
    return pop;
  }

  function _show(tableEl, colIdx, headerEl) {
    const pop = _ensurePopover();
    _active = { tableEl, colIdx };
    const title = (headerEl.cloneNode(true).childNodes[0]?.textContent || headerEl.textContent || '').trim();
    document.getElementById('icfp-title').textContent = `${title || '컬럼'} 검색`;
    const current = (_filters.get(tableEl) || {})[colIdx] || '';
    const input = document.getElementById('icfp-input');
    input.value = current;
    const rect = headerEl.getBoundingClientRect();
    pop.style.display = 'block';
    pop.style.top = (rect.bottom + window.scrollY + 4) + 'px';
    pop.style.left = (rect.left + window.scrollX) + 'px';
    setTimeout(() => {
      const r = pop.getBoundingClientRect();
      if (r.right > window.innerWidth - 10) {
        pop.style.left = (window.innerWidth - r.width - 10 + window.scrollX) + 'px';
      }
      input.focus(); input.select();
    }, 30);
  }

  function _hide() {
    const pop = document.getElementById('iloomColFilterPopover');
    if (pop) pop.style.display = 'none';
    _active = null;
  }

  function _apply() {
    if (!_active) return;
    const { tableEl, colIdx } = _active;
    const v = (document.getElementById('icfp-input').value || '').trim();
    const f = _filters.get(tableEl) || {};
    if (v) f[colIdx] = v; else delete f[colIdx];
    _filters.set(tableEl, f);
    _applyTableFilters(tableEl);
    _markHeader(tableEl, colIdx, !!v);
    _hide();
  }

  function _clear() {
    if (!_active) return;
    const { tableEl, colIdx } = _active;
    const f = _filters.get(tableEl) || {};
    delete f[colIdx];
    _filters.set(tableEl, f);
    document.getElementById('icfp-input').value = '';
    _applyTableFilters(tableEl);
    _markHeader(tableEl, colIdx, false);
    _hide();
  }

  function _applyTableFilters(tableEl) {
    const f = _filters.get(tableEl) || {};
    const entries = Object.entries(f).map(([k, v]) => [parseInt(k), v.toUpperCase()]);
    const tbody = tableEl.tBodies[0];
    if (!tbody) return;
    [...tbody.rows].forEach(row => {
      // 펼침/상세 행이나 보조 행은 건너뜀 (data-no-filter 또는 colspan)
      if (row.dataset.noFilter !== undefined) return;
      const firstCellSpan = row.cells[0] ? parseInt(row.cells[0].getAttribute('colspan') || '1') : 1;
      if (firstCellSpan > 1) return;
      let match = true;
      for (const [colIdx, q] of entries) {
        const cell = row.cells[colIdx];
        const text = (cell ? (cell.textContent || '') : '').toUpperCase();
        if (!text.includes(q)) { match = false; break; }
      }
      row.style.display = match ? '' : 'none';
    });
  }

  function _markHeader(tableEl, colIdx, on) {
    const ths = tableEl.tHead ? tableEl.tHead.rows[0]?.cells : null;
    if (!ths || !ths[colIdx]) return;
    ths[colIdx].classList.toggle('iloom-col-filter-active', on);
  }

  // contextmenu 핸들러 (글로벌)
  document.addEventListener('contextmenu', e => {
    const th = e.target.closest('thead th');
    if (!th) return;
    // DataTables 컴포넌트는 별도 처리 → 충돌 방지
    if (th.closest('.dataTables_wrapper')) return;
    const tableEl = th.closest('table');
    if (!tableEl) return;
    // opt-out: 테이블에 data-no-col-filter 속성 있으면 무시
    if (tableEl.dataset.noColFilter !== undefined) return;
    // 컬럼 인덱스 계산 (rowspan/colspan 무시한 단순 인덱스)
    const headerRow = th.parentElement;
    const colIdx = [...headerRow.cells].indexOf(th);
    if (colIdx < 0) return;
    e.preventDefault();
    _show(tableEl, colIdx, th);
  });

  // 페이지 전역: 헤더에 우클릭 가능 안내 (visual hint via cursor)
  const style = document.createElement('style');
  style.textContent = `
    table thead th:not(.no-filter) { cursor: context-menu; }
    .dataTables_wrapper table thead th { cursor: pointer; }
  `;
  document.head.appendChild(style);

  // 외부 API
  window.IloomColFilter = {
    reset(tableEl) {
      _filters.set(tableEl, {});
      tableEl.tHead && [...tableEl.tHead.rows[0].cells].forEach(th => th.classList.remove('iloom-col-filter-active'));
      _applyTableFilters(tableEl);
    },
  };
})();
</script>


</body>
