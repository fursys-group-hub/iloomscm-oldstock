<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR','Montserrat',sans-serif;background:#F4F5F7;color:#1F2937;font-size:14px}
/* Nav */
.iloom-nav{position:sticky;top:0;background:#fff;border-bottom:1px solid #E0E0E0;z-index:1000;font-family:'Noto Sans KR','Montserrat',sans-serif}
.iloom-nav-inner{max-width:1400px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:28px;flex-wrap:wrap}

.iloom-nav-logo .dv{display:inline-block;width:1px;height:14px;background:#E0E0E0;margin:0 10px;vertical-align:middle}
.iloom-nav-logo .sub{font-family:'Noto Sans KR',sans-serif;font-weight:500;font-size:13px;color:#333}
.iloom-nav-tabs{display:flex;gap:0;flex-wrap:wrap}
.iloom-tab{padding:16px 18px;font-size:13px;color:#666;text-decoration:none;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;font-weight:500;white-space:nowrap}
.iloom-tab:hover{color:#333}
.iloom-tab.active{color:#c80a1e;border-bottom-color:#c80a1e;font-weight:700}

.nav-auth{margin-left:auto;display:flex;align-items:center;gap:8px;padding:0 4px}

.btn-nav-login:hover{background:#a50818}

.btn-nav-logout:hover{background:#E5E7EB}

.page-header h1{font-size:20px;font-weight:700;color:#111827}
.page-header .meta{font-size:12px;color:#6B7280;margin-top:4px}
.summary-bar{display:flex;align-items:center;gap:24px;padding:14px 24px;background:#fff;border-bottom:1px solid #E5E7EB;flex-wrap:wrap}
.sum-item{display:flex;flex-direction:column;align-items:center;gap:2px}
.sum-num{font-size:22px;font-weight:700;line-height:1}
.sum-lbl{font-size:11px;color:#6B7280}
.sum-sep{width:1px;height:40px;background:#E5E7EB;margin:0 8px}
.toolbar{display:flex;align-items:center;gap:12px;padding:12px 24px;background:#fff;border-bottom:1px solid #E5E7EB;flex-wrap:wrap}
.search-box{padding:6px 12px;border:1px solid #D1D5DB;border-radius:6px;font-size:13px;width:220px;outline:none}
.search-box:focus{border-color:#c80a1e}
.btn-refresh{padding:6px 14px;border:1px solid #D1D5DB;background:#fff;border-radius:6px;font-size:12px;cursor:pointer;color:#374151}
.btn-refresh:hover{background:#F9FAFB}
.type-filter-bar{display:flex;align-items:center;gap:6px;padding:10px 24px;background:#fff;border-bottom:1px solid #E5E7EB;flex-wrap:wrap}
.type-filter-label{font-size:12px;color:#6B7280;font-weight:600;margin-right:4px}
.type-btn{padding:5px 12px;border:1px solid #D1D5DB;background:#F9FAFB;border-radius:14px;font-size:12px;cursor:pointer;color:#9CA3AF}
.type-btn.active{background:#EEF2FF;border-color:#6366f1;color:#4338CA;font-weight:600}
.type-btn-all{padding:5px 12px;border:1px solid #D1D5DB;background:#fff;border-radius:6px;font-size:11px;cursor:pointer;color:#374151;margin-left:8px}
.type-btn-all:hover{background:#F9FAFB}
.result-wrap{padding:24px;overflow-x:auto}
.result-table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.result-table th{background:#F9FAFB;border-bottom:2px solid #E5E7EB;padding:10px 12px;font-size:12px;font-weight:600;color:#374151;text-align:left;white-space:nowrap}
.result-table td{padding:10px 12px;font-size:13px;border-bottom:1px solid #F3F4F6;vertical-align:middle}
.result-table tr:hover td{background:#FFFBEB}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;white-space:nowrap}
.badge-arrival{background:#FEF3C7;color:#92400E}
.badge-vn{background:#FEE2E2;color:#991B1B}
.num-neg{color:#c80a1e;font-weight:700}
.num-pos{color:#059669;font-weight:700}
.empty-msg{padding:60px 24px;text-align:center;color:#9CA3AF;font-size:14px}
.loading-msg{padding:60px 24px;text-align:center;color:#6B7280;font-size:14px}
</style>

<script>
// ── 인증 ─────────────────────────────────────────────────────────
const EP_DEFAULT_IDS = ['k94rainy','wonsuk_kim','nakwon_choi'];
const LS_EP_IDS_KEY  = 'iloom_allowed_ep_ids';
const SS_USER_KEY    = 'iloom_ep_session';
const SHEET_ID        = '1sAvWHksA3hhlDRvGsXqHdbSvO07MFTCrebuVoRk9LSc';

function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function fetchSheet(sheetId, name, requiredCols) {
  const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&headers=1&sheet=${encodeURIComponent(name)}`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  const text = await resp.text();
  const json = JSON.parse(text.replace(/^[^(]+\(/, '').replace(/\);\s*$/, ''));
  if (json.status === 'error') throw new Error(json.errors?.[0]?.message || 'Sheets 오류');
  const cols = json.table.cols.map(c => c.label);
  if (requiredCols && !requiredCols.every(c => cols.includes(c))) {
    throw new Error(`'${name}' 시트를 찾을 수 없거나 컬럼이 다릅니다`);
  }
  return (json.table.rows || []).map(row => {
    const obj = {};
    (row.c || []).forEach((cell, i) => { obj[cols[i]] = cell ? (cell.v ?? '') : ''; });
    return obj;
  });
}

async function fetchApprovedIds() {
  try {
    const rows = await fetchSheet(SHEET_ID, '권한관리', ['EP ID', '상태']);
    return rows.filter(r => String(r['상태'] || '').trim() === '승인').map(r => String(r['EP ID'] || '').trim()).filter(Boolean);
  } catch(e) { return []; }
}

function getAllowedIds() {
  try {
    const stored = JSON.parse(localStorage.getItem(LS_EP_IDS_KEY) || 'null');
    if (Array.isArray(stored)) return [...new Set([...EP_DEFAULT_IDS, ...stored])];
  } catch(e) {}
  return [...EP_DEFAULT_IDS];
}
function getLoggedInUser() { return sessionStorage.getItem(SS_USER_KEY) || null; }

function showLoginModal() {
  const saved = localStorage.getItem('iloom_saved_ep_id') || '';
  document.getElementById('loginInput').value = saved;
  const chk = document.getElementById('saveIdChk');
  if (chk) chk.checked = !!saved;
  document.getElementById('loginError').textContent = '';
  document.getElementById('loginModal').style.display = 'flex';
  setTimeout(() => document.getElementById('loginInput').focus(), 50);
}
function hideLoginModal() { document.getElementById('loginModal').style.display = 'none'; }

async function doLogin() {
  const val = document.getElementById('loginInput').value.trim();
  if (!val) { document.getElementById('loginError').textContent = 'ID를 입력하세요.'; return; }
  document.getElementById('loginError').textContent = '확인 중...';
  const approved = await fetchApprovedIds();
  const allIds = [...new Set([...getAllowedIds(), ...approved])];
  if (allIds.includes(val)) {
    sessionStorage.setItem(SS_USER_KEY, val);
    const chk = document.getElementById('saveIdChk');
    if (chk && chk.checked) localStorage.setItem('iloom_saved_ep_id', val);
    else localStorage.removeItem('iloom_saved_ep_id');
    hideLoginModal();
    updateAuthUI();
  } else {
    document.getElementById('loginError').textContent = '허용되지 않은 EP ID입니다.';
  }
}
function doLogout() { sessionStorage.removeItem(SS_USER_KEY); updateAuthUI(); }

function updateAuthUI() {
  const user = getLoggedInUser();
  document.getElementById('authOverlay').style.display = user ? 'none' : 'flex';
  document.getElementById('btnNavLogin').style.display  = user ? 'none' : '';
  document.getElementById('btnNavLogout').style.display = user ? '' : 'none';
  const chip = document.getElementById('navUserChip');
  chip.style.display = user ? '' : 'none';
  chip.textContent   = user ? `👤 ${user}` : '';
  document.querySelectorAll('.auth-hide').forEach(el => { el.style.display = user ? 'inline' : 'none'; });
  if (user) loadData();
}

// ── VN 모니터링 데이터 ─────────────────────────────────────────────
const VN_SHEET_ID = '1xPsUnyf4qIEKTTDR36W--AdgIrzuFw_QAeOXdPielqY';
const VN_TAB_NAME = '보고';

let allItems = [];

async function fetchVnRows() {
  const url = `https://docs.google.com/spreadsheets/d/${VN_SHEET_ID}/gviz/tq?tqx=out:json&headers=1&sheet=${encodeURIComponent(VN_TAB_NAME)}`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  const text = await resp.text();
  const json = JSON.parse(text.replace(/^[^(]+\(/, '').replace(/\);\s*$/, ''));
  if (json.status === 'error') throw new Error(json.errors?.[0]?.message || 'Sheets 오류');
  return json.table.rows || [];
}

// 열 위치: A=코드, C=명칭, O=가용재고, S=해상재고, U=해상재고 포함 가용재고
const COL_CODE = 0, COL_NAME = 2, COL_TYPE = 3, COL_AVAIL = 14, COL_SEA = 18, COL_TOTAL = 20;

let activeTypes = null; // null = 전체 표시. 아니면 Set of 선택된 형태구분.

function classifyRows(rows) {
  const out = [];
  for (const r of rows) {
    const c = r.c;
    if (!c) continue;
    const code = c[COL_CODE] && typeof c[COL_CODE].v === 'string' ? c[COL_CODE].v.trim() : '';
    if (!code) continue;
    const availCell = c[COL_AVAIL];
    if (!availCell || typeof availCell.v !== 'number') continue; // 병합헤더 잔여행 등 스킵
    const avail = availCell.v;
    if (avail >= 0) continue; // 1. 정상 — 모니터링에서 숨김

    const name = c[COL_NAME] && c[COL_NAME].v != null ? String(c[COL_NAME].v) : '';
    const type = c[COL_TYPE] && c[COL_TYPE].v != null ? String(c[COL_TYPE].v).trim() : '(미분류)';
    const sea  = (c[COL_SEA]   && typeof c[COL_SEA].v   === 'number') ? c[COL_SEA].v   : 0;
    const total = (c[COL_TOTAL] && typeof c[COL_TOTAL].v === 'number') ? c[COL_TOTAL].v : (avail + sea);

    const status = total > 0
      ? { key: 'arrival', label: '입고일 점검' }   // 2. 가용재고 음수, 해상재고 있어 U는 양수
      : { key: 'vn',      label: '베트남 출고 확인' }; // 3. 가용재고·U 모두 음수

    out.push({ code, name, type, avail, sea, total, status });
  }
  return out;
}

function renderTypeFilterBar() {
  const bar = document.getElementById('typeFilterBar');
  const types = [...new Set(allItems.map(it => it.type))].sort();
  const pills = types.map(t => {
    const active = activeTypes === null || activeTypes.has(t);
    return `<button class="type-btn${active ? ' active' : ''}" data-type="${esc(t)}" onclick="toggleType('${esc(t)}')">${esc(t)}</button>`;
  }).join('');
  bar.innerHTML = `<span class="type-filter-label">형태구분</span>${pills}<button class="type-btn-all" onclick="resetTypes()">전체 선택</button>`;
}

function toggleType(type) {
  const types = [...new Set(allItems.map(it => it.type))];
  if (activeTypes === null) activeTypes = new Set(types); // 처음 클릭 시 전체 상태에서 시작
  if (activeTypes.has(type)) activeTypes.delete(type);
  else activeTypes.add(type);
  renderTypeFilterBar();
  filterTable();
}

function resetTypes() {
  activeTypes = null;
  renderTypeFilterBar();
  filterTable();
}

function fmt(n) {
  const v = Math.round(n * 10) / 10;
  return v.toLocaleString('ko-KR');
}

function renderTable(items) {
  const body = document.getElementById('tableBody');
  if (!items.length) {
    body.innerHTML = '<tr><td colspan="7" class="empty-msg">조건에 해당하는 품목이 없습니다.</td></tr>';
    return;
  }
  body.innerHTML = items.map(it => {
    const badge = it.status.key === 'arrival'
      ? `<span class="badge badge-arrival">입고일 점검</span>`
      : `<span class="badge badge-vn">베트남 출고 확인</span>`;
    return `<tr data-code="${esc(it.code.toLowerCase())}" data-name="${esc(it.name.toLowerCase())}">
      <td style="font-family:Montserrat,monospace;font-weight:600">${esc(it.code)}</td>
      <td>${esc(it.name)}</td>
      <td>${esc(it.type)}</td>
      <td style="text-align:right" class="num-neg">${fmt(it.avail)}</td>
      <td style="text-align:right">${fmt(it.sea)}</td>
      <td style="text-align:right" class="${it.total > 0 ? 'num-pos' : 'num-neg'}">${fmt(it.total)}</td>
      <td>${badge}</td>
    </tr>`;
  }).join('');
}

function filterTable() {
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  const filtered = allItems.filter(it => {
    const matchesQ = !q || it.code.toLowerCase().includes(q) || it.name.toLowerCase().includes(q);
    const matchesType = activeTypes === null || activeTypes.has(it.type);
    return matchesQ && matchesType;
  });
  renderTable(filtered);
  document.getElementById('resultCount').textContent = (q || activeTypes !== null) ? `${filtered.length} / ${allItems.length} 건` : '';
}

async function loadData() {
  const body = document.getElementById('tableBody');
  body.innerHTML = '<tr><td colspan="7" class="loading-msg">불러오는 중...</td></tr>';
  try {
    const rows = await fetchVnRows();
    allItems = classifyRows(rows);
    allItems.sort((a, b) => a.total - b.total);
    activeTypes = null; // 새로고침 시 형태구분 필터 초기화(전체 표시)

    const arrivalCount = allItems.filter(it => it.status.key === 'arrival').length;
    const vnCount = allItems.filter(it => it.status.key === 'vn').length;
    document.getElementById('sumTotal').textContent = allItems.length;
    document.getElementById('sumArrival').textContent = arrivalCount;
    document.getElementById('sumVn').textContent = vnCount;
    document.getElementById('sumFetchedAt').textContent = new Date().toLocaleString('ko-KR', { hour12: false });

    renderTypeFilterBar();
    filterTable();
  } catch (e) {
    body.innerHTML = `<tr><td colspan="7" class="empty-msg" style="color:#c80a1e">데이터 로딩 실패: ${esc(e.message)}</td></tr>`;
  }
}

updateAuthUI();
</script>
</body>
</html>
